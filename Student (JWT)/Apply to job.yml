info:
  name: Apply to job
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/jobs/apply"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jobId": {{jobId}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: CampusMesh click ledger only — this does NOT submit to Greenhouse/Lever. The client opens primaryUrl afterwards. jobId must be an integer >= 1.
