info:
  name: Apply to job
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/jobs/apply"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jobId": {{jobId}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: apply to job example
    request:
      url: "{{baseUrl}}/jobs/apply"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobId": {{jobId}}
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: access-control-allow-headers
          value: Content-Type, Authorization
        - name: access-control-allow-methods
          value: GET, POST, PUT, DELETE, OPTIONS
        - name: content-type
          value: application/json; charset=utf-8
        - name: vary
          value: origin
        - name: access-control-expose-headers
          value: WWW-Authenticate,Server-Authorization
        - name: cache-control
          value: no-cache
        - name: content-length
          value: "597"
        - name: date
          value: Fri, 11 Sep 2026 08:16:19 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
