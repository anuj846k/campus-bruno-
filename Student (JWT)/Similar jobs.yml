info:
  name: Similar jobs
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/jobs/{{jobId}}/similar?limit=5"
  params:
    - name: limit
      value: "5"
      type: query
      description: Default 5, capped at 20.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Same company, excluding this job. Ranked by matching employment_type, then workplace_type, then posted_at DESC. No description field.
