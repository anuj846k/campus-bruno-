info:
  name: My bookmarks
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/jobs/my-bookmarks?limit=50&offset=0"
  params:
    - name: limit
      value: "50"
      type: query
      description: Default 50, capped at 100.
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
