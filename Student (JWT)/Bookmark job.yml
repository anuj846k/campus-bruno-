info:
  name: Bookmark job
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/jobs/bookmark"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jobId": {{jobId}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

